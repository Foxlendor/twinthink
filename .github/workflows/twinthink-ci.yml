name: TwinThink CI

on:
  push:
  pull_request:

jobs:
  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core dependencies
        run: python -m pip install --upgrade pip pydantic
      - name: Run Twin Factory tests
        env:
          PYTHONPATH: packages
        run: python -m unittest packages/twinthink/test_ingestion.py packages/twinthink/test_factory.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
